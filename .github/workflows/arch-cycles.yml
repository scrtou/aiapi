name: arch-cycles (R4)

on:
  push:
    paths: ['src/**', 'tools/arch/**', '.github/workflows/arch-cycles.yml']
  pull_request:
    paths: ['src/**', 'tools/arch/**', '.github/workflows/arch-cycles.yml']

jobs:
  check-cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 防回归：实测结果必须是基线的子集
      - name: R4 - no new dependency cycles
        run: python3 tools/arch/check_cycles.py --evidence --baseline tools/arch/cycles-baseline.json

      # 阶段 0.7 已完成（2026-08-08）：target 收紧为 0 环，升级为强制门禁
      - name: R4 - zero-cycle target (enforced)
        run: python3 tools/arch/check_cycles.py --baseline tools/arch/cycles-target.json

      # 分层边界：环检测看不见「中立层被污染」——污染不构成环。
      # domain/ 出边一旦非空即失败（退出码 3）。
      - name: R4 - layer boundary (domain must stay neutral)
        run: python3 tools/arch/check_cycles.py --layer-rules tools/arch/layer-rules.json

      # dbManager 直接依赖棘轮（退出码 4）。前三道都看不见这类退化：
      # 业务层 -> dbManager 是单向边不成环；模块粒度的 layer-rules 又早已放行它。
      # 文件粒度才拦得住「在已白名单模块里追加 include」这条侵蚀通道。
      - name: R4 - dbManager include ratchet (file-level)
        run: python3 tools/arch/check_cycles.py --db-ratchet tools/arch/db-include-ratchet.json

      # 门禁自检：一道从不 FAIL 的门禁比没有门禁更危险。
      # 这里故意制造违规，断言脚本确实以对应退出码失败。
      # 若脚本哪天被改成永远返回 0，上面四道会全绿，只有这一步能发现。
      - name: R4 - gate selftest (gates must actually fail)
        run: |
          set -u
          fail=0

          expect_rc() {
            local want="$1"; shift
            set +e
            "$@" > /tmp/selftest.log 2>&1
            local got=$?
            set -e
            if [ "$got" != "$want" ]; then
              echo "::error::selftest expected rc=$want got rc=$got for: $*"
              tail -20 /tmp/selftest.log
              fail=1
            else
              echo "  ok  rc=$got  $*"
            fi
          }

          echo '--- probe A: business layer adds direct dbManager include -> expect rc=4 ---'
          cp src/retoolWorkspace/RetoolWorkspaceManager.cpp /tmp/probe_a.bak
          sed -i '2i #include <dbManager/retoolWorkspace/RetoolWorkspaceDbManager.h>' \
            src/retoolWorkspace/RetoolWorkspaceManager.cpp
          expect_rc 4 python3 tools/arch/check_cycles.py --db-ratchet tools/arch/db-include-ratchet.json
          cp /tmp/probe_a.bak src/retoolWorkspace/RetoolWorkspaceManager.cpp

          echo '--- probe B: domain/ gains an outgoing edge -> expect rc=3 ---'
          printf '#pragma once\n#include "RetoolWorkspaceManager.h"\n' > src/domain/__selftest_probe.h
          expect_rc 3 python3 tools/arch/check_cycles.py --layer-rules tools/arch/layer-rules.json
          rm -f src/domain/__selftest_probe.h

          echo '--- restore check: probe paths only ---'
          # 断言范围必须只覆盖探针触碰过的路径。
          # 用全仓库 git status 会把「本次 PR 的正常改动」误判为探针残留，
          # 断的就不是「探针已复原」而是「工作区干净」——两者不是一回事。
          probe_dirty=$(git status --porcelain -- \
            src/retoolWorkspace/RetoolWorkspaceManager.cpp \
            src/domain/)
          if [ -n "$probe_dirty" ]; then
            echo '::error::selftest failed to restore probe paths'
            echo "$probe_dirty"
            fail=1
          else
            echo '  ok  probe paths restored'
          fi

          exit $fail
